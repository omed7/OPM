name: JS Syntax Check

on:
  pull_request:

jobs:
  check-js-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: |
          # Use shopt globstar for recursive matching if needed in bash,
          # or find is a safe bet
          find public -name "*.js" -type f -print0 | xargs -0 -I {} node --check {}
