name: JS Syntax Check

on:
  pull_request:

jobs:
  check-js-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: |
          # Use shopt globstar for recursive matching if needed in bash,
          # or find is a safe bet
          find public -name "*.js" -type f -print0 | xargs -0 -I {} node --check {}

  check-python-and-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python3 -m compileall -q src tests
      - name: Validate public data artifact
        run: python3 src/validate_public_data.py public/data.json
