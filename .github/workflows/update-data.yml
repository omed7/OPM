name: Update Data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: opm-main-writers
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Refresh main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Required Supabase Actions secrets are not configured."
            exit 1
          fi
          GITHUB_SHA="$(git rev-parse HEAD)" python3 src/output_writer.py

      - name: Check if fixtures changed
        id: check_changed
        run: |
          if git show HEAD:public/data.json > old_data.json 2>/dev/null; then
            if python3 src/check_changes.py old_data.json public/data.json; then
              echo "changed=false" >> $GITHUB_OUTPUT
            else
              echo "changed=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check_changed.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -- public/data.json
          if [ "$(git diff --cached --name-only)" != "public/data.json" ]; then
            echo "::error::Unexpected generated files staged for commit."
            exit 1
          fi
          git commit -m "chore: update fixture data"
          git push origin HEAD:main
