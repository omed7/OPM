<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football xG Predictions</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // Set theme immediately to avoid flash of light mode
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body>
    <header>
        <h1>Football Predictions</h1>
        <div class="header-right">

            <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle dark mode">🌙</button>
        </div>
    </header>

    <div id="date-strip" class="date-strip" aria-label="Fixture dates"></div>
    <main id="fixtures-container" tabindex="-1">
        <!-- Active tab content will be loaded here -->
        <div class="loading">Loading fixtures...</div>
    </main>

    <nav class="bottom-nav" aria-label="Primary navigation">
        <button id="home-tab" class="bottom-nav-item" type="button" role="tab" aria-selected="true">Home</button>
        <button id="league-tab" class="bottom-nav-item" type="button" role="tab" aria-selected="false">League</button>
        <button id="favorite-tab" class="bottom-nav-item" type="button" role="tab" aria-selected="false">Favorite</button>
    </nav>

    <footer>
        <p id="version-tag"></p>
        <p id="badge-attribution"></p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
